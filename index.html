<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000207">
<title>Host PSM • ESP32-S2</title>
<script type="module" src="esp-web-tools/install-button.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#f4f7fb}
html{background:#000207}
body{background-color:#000207;background-image:radial-gradient(ellipse at 50% 48%,#0a1c31 0%,#03101e 40%,#01050d 72%,#000104 100%);color-scheme:dark;--md-sys-color-surface:#151b24;--md-sys-color-surface-container:#111820;--md-sys-color-surface-container-high:#182231;--md-sys-color-surface-container-highest:#202b39;--md-sys-color-on-surface:#edf4fb;--md-sys-color-on-surface-variant:#a9b8c7;--md-sys-color-primary:#7cc7ff;--md-sys-color-on-primary:#06111e;--md-sys-color-secondary-container:#10263c;--md-sys-color-on-secondary-container:#dcecff;--md-sys-color-outline:#4f6880;--md-sys-color-error:#ff6b78;--md-dialog-container-color:#151b24;--md-dialog-headline-color:#f5f8fb;--md-dialog-supporting-text-color:#dbe5ef;--md-text-button-label-text-color:#7cc7ff;--text-color:#edf4fb;--danger-color:#ff6b78}
#root{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#screenAura{position:absolute;left:230px;top:80px;width:820px;height:560px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(25,98,177,.16) 0%,rgba(8,36,73,.07) 47%,rgba(0,0,0,0) 74%)}
#panel{position:absolute;left:320px;top:180px;width:640px;height:360px;overflow:hidden;border:1px solid #36556f;border-radius:18px;background-color:#030911;background-image:linear-gradient(to bottom,#0b1827 0%,#06111e 42%,#02070d 100%);box-shadow:0 26px 58px rgba(0,0,0,.82),0 0 20px rgba(27,107,189,.20),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(37,105,161,.23)}
#panelSheen{position:absolute;left:0;top:0;width:640px;height:92px;background:linear-gradient(to bottom,rgba(91,166,220,.11),rgba(33,79,116,.025) 62%,rgba(0,0,0,0))}
#panelAura{position:absolute;left:98px;top:124px;width:444px;height:208px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(24,102,178,.18) 0%,rgba(6,39,76,.07) 48%,rgba(0,0,0,0) 76%)}
#innerFrame{position:absolute;left:4px;top:4px;right:4px;bottom:4px;border:1px solid rgba(111,170,212,.08);border-radius:14px}
#hdrTitle{position:absolute;left:22px;top:12px;font-family:monospace;font-size:14px;font-weight:700;letter-spacing:3px;white-space:nowrap;color:#f5f8fb;text-transform:uppercase;text-shadow:0 2px 3px rgba(0,0,0,.92),0 0 8px rgba(255,255,255,.025)}
#hdrTitle .accent{color:#49b8ff;text-shadow:0 0 7px rgba(73,184,255,.38)}
#subtitle{position:absolute;left:22px;top:34px;font-size:10.5px;font-weight:700;letter-spacing:1px;color:#a7b5c2;white-space:nowrap;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.92)}
#subtitle .accent{color:#49b8ff;font-weight:800;text-shadow:0 0 6px rgba(73,184,255,.22)}
#headLine{position:absolute;left:22px;right:22px;top:72px;height:1px;background:linear-gradient(to right,rgba(34,58,77,.25),rgba(55,112,151,.62) 20%,rgba(55,112,151,.62) 80%,rgba(34,58,77,.25));box-shadow:0 1px 0 rgba(0,0,0,.62)}
#badge{position:absolute;right:22px;top:12px;width:132px;height:44px;border:1px solid rgba(72,184,255,.34);border-radius:14px;background:linear-gradient(to bottom,rgba(56,145,204,.095),rgba(6,25,42,.12));box-shadow:0 0 0 1px rgba(177,228,255,.024),inset 0 1px 0 rgba(255,255,255,.07),0 7px 16px rgba(0,0,0,.15),0 0 12px rgba(55,153,223,.08);text-align:center;text-transform:uppercase;overflow:hidden}
#badge:before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(to right,transparent,#48b8ff 50%,transparent);opacity:.72}
#badge .label,#badge .main,#badge .sub{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;text-transform:uppercase}
#badge .label{top:7px;color:#49b8ff;font-size:6px;font-weight:800;letter-spacing:1.32px}
#badge .main{top:16px;color:#eef3f7;font-size:10px;font-weight:800;letter-spacing:1.08px}
#badge .sub{top:30px;color:#8494a2;font-size:5px;font-weight:700;letter-spacing:.94px}
#contentSurface{position:absolute;left:67px;top:100px;width:506px;height:188px;border:1px solid rgba(80,145,193,.52);border-radius:24px;background-color:#06101c;background-image:linear-gradient(to bottom,#0b1d31 0%,#071522 48%,#030a12 100%);overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.32),0 0 0 1px rgba(151,213,249,.035),inset 0 1px 0 rgba(218,243,255,.10),inset 0 -1px 0 rgba(27,91,142,.18),inset 0 0 30px rgba(18,75,128,.10)}
#contentSurface:before{content:"";position:absolute;left:18px;right:18px;top:0;height:39px;border-radius:22px 22px 50% 50%;background:linear-gradient(to bottom,rgba(167,221,251,.08),rgba(62,139,191,.015),rgba(0,0,0,0))}
#stageLabel{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:8.3px;font-weight:700;letter-spacing:3.2px;color:#3faef2;white-space:nowrap;text-shadow:0 0 7px rgba(45,151,234,.24)}
#stageTitle{position:absolute;left:24px;right:24px;top:47px;text-align:center;font-size:25px;font-weight:700;letter-spacing:.3px;line-height:1.12;color:#f7f9fb;white-space:nowrap;text-shadow:0 3px 5px rgba(0,0,0,.9),0 0 12px rgba(255,255,255,.05)}
#stageRule{position:absolute;left:180px;right:180px;top:84px;height:1px;background:#28536f;opacity:.52}
#stageText{position:absolute;left:32px;right:32px;top:99px;text-align:center;font-size:11px;line-height:1.45;color:#aab6c1;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.9)}
#installWrap{position:absolute;left:110px;right:110px;top:126px;height:44px}
esp-web-install-button{display:block;width:100%;height:100%}
.installBtn{appearance:none;-webkit-appearance:none;width:100%;height:44px;border:1px solid #4baee9;border-radius:12px;background-color:#081726;background-image:linear-gradient(to bottom,#123457 0%,#0b2845 48%,#06111e 100%);color:#f8fbff;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 0 2px rgba(56,136,224,.10),0 0 10px rgba(75,181,249,.42),0 0 20px rgba(35,119,225,.22),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(20,82,130,.35);text-shadow:0 1px 2px rgba(0,0,0,.88);transition:filter .14s ease,transform .14s ease,border-color .14s ease}
.installBtn:hover{filter:brightness(1.09);border-color:#74c8fb;transform:translateY(-1px)}
.installBtn:active{transform:translateY(0);filter:brightness(.98)}
.unsupported{position:absolute;left:-70px;right:-70px;top:48px;color:#efbd67;font-size:9px;line-height:1.35;text-align:center;letter-spacing:.2px}
#footer{position:absolute;left:75px;top:317px;width:490px;height:25px;border-top:1px solid #23445b;background-color:rgba(3,10,18,.20)}
#footerText{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:8.6px;font-weight:600;letter-spacing:2.2px;color:#7f909e;white-space:nowrap;text-shadow:0 2px 3px rgba(0,0,0,.92)}
</style>
</head>
<body>
<div id="root">
  <div id="screenAura"></div>
  <div id="panel">
    <div id="panelSheen"></div>
    <div id="panelAura"></div>
    <div id="innerFrame"></div>

    <div id="hdrTitle">HOST PSM <span class="accent">•</span> ESP32-S2</div>
    <div id="subtitle">WEBKIT <span class="accent">+</span> pooP2JB <span class="accent">+</span> PLDMGR</div>

    <div id="badge">
      <span class="label">HOST PSMACEDO</span>
      <span class="main">ESP32-S2</span>
      <span class="sub">FW 12.02–12.70</span>
    </div>

    <div id="headLine"></div>

    <div id="contentSurface">
      <div id="stageLabel">INSTALAÇÃO VIA USB</div>
      <div id="stageTitle">INSTALAR NA ESP32-S2</div>
      <div id="stageRule"></div>
      <div id="stageText">Pronto para instalar o Host PSM na ESP32-S2.</div>
      <div id="installWrap">
        <esp-web-install-button manifest="manifest.json">
          <button slot="activate" class="installBtn">INSTALAR</button>
          <div slot="unsupported" class="unsupported">Use Chrome ou Edge compatível.</div>
        </esp-web-install-button>
      </div>
    </div>

    <div id="footer"><div id="footerText">HOST PSM • ESP32-S2</div></div>
  </div>
</div>
<script>
(function(){
  var root=document.getElementById('root');
  function fit(){
    var w=window.innerWidth||1280,h=window.innerHeight||720;
    var s=Math.min(w/1280,h/720);
    var ox=Math.floor((w-1280*s)/2),oy=Math.floor((h-720*s)/2);
    root.style.left=ox+'px';root.style.top=oy+'px';root.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit,false);fit();
})();
</script>
</body>
</html>

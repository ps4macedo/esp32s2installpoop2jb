<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f17">
<title>Host PSM • ESP32-S2</title>
<script type="module" src="hostpsm-web-installer.js?v=20260912-visual1"></script>
<style>
:root{color-scheme:dark;--ink:#f0f4fc;--muted:#a3b2c9;--blue:#47b6ff;--line:#293c53;--surface:#111a25}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;min-height:100%;margin:0}
body{background:#080f17;background-image:radial-gradient(ellipse at 50% 42%,#152638 0%,#0a141f 45%,#060c13 85%);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}
button,summary{-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:2px solid #80cbff;outline-offset:5px}
.iconDefs{position:absolute;width:0;height:0;overflow:hidden}
.uiIcon{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#root{min-height:100svh;display:grid;place-items:center;padding:32px 20px}
#panel{width:min(720px,100%);border:1px solid #34495f;border-radius:24px;background:linear-gradient(125deg,rgba(21,33,47,.97),rgba(13,22,32,.98));box-shadow:0 28px 100px #0008,inset 0 1px 0 #e5f0ff12;overflow:hidden}
.brandRow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:25px 32px;border-bottom:1px solid #293c535e}
.brand{display:flex;align-items:center;gap:11px;font-size:17px;letter-spacing:.6px;font-weight:700}
.version{font-size:11px;font-weight:500;letter-spacing:.3px;color:#9caec4;padding:4px 7px;border:1px solid #304155;border-radius:6px}
.compatibility{font-size:12px;color:#a4b4c9;letter-spacing:.15px;white-space:nowrap}
.homeContent{padding:44px 32px 46px;text-align:center}
.iconTile{display:grid;place-items:center;width:66px;height:66px;border-radius:18px;border:1px solid #2c435b;background:linear-gradient(145deg,#1a2a3c,#101e2c);color:var(--blue);box-shadow:inset 0 1px 0 #cce8ff06}
.iconTile .uiIcon{width:38px;height:38px;stroke-width:1.45}
.homeContent .iconTile{width:78px;height:78px;margin:0 auto 25px;border-radius:21px}
.homeContent .iconTile .uiIcon{width:44px;height:44px}
#stageTitle{margin:0;font-size:clamp(25px,3.5vw,34px);font-weight:650;letter-spacing:-.7px;line-height:1.25}
#stageText{font-size:15px;color:var(--muted);line-height:1.55;margin:15px auto 29px;max-width:440px}
.installBtn,.modalBtn{appearance:none;border:1px solid #57b7ff;border-radius:13px;background:linear-gradient(135deg,#147bff,#0060ef);color:#fff;font-size:15px;font-weight:650;line-height:1.2;box-shadow:inset 0 1px 0 #ffffff30,0 5px 22px #005dff20;transition:filter .15s,border-color .15s,background .15s}
.installBtn:hover:not(:disabled),.modalBtn:hover:not(:disabled){filter:brightness(1.1)}
.installBtn:active:not(:disabled),.modalBtn:active:not(:disabled){filter:brightness(.95)}
.installBtn{min-width:224px;min-height:52px;padding:15px 28px}
.unsupported{max-width:320px;margin:18px auto 0;font-size:13px;color:#dfc297;line-height:1.5}
#hostpsmModal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:#030910bc;backdrop-filter:blur(12px)}
#hostpsmModal.open{display:flex}
.modalCard{width:min(736px,100%);max-height:calc(100svh - 48px);overflow:auto;border:1px solid #3b5069;border-radius:22px;background:linear-gradient(120deg,#14202d 0%,#101a24 55%,#101923 100%);box-shadow:0 26px 100px #0009,inset 0 1px 0 #e7f2ff12;scrollbar-color:#34485e transparent;scrollbar-width:thin}
.modalHead{position:relative;display:flex;align-items:center;gap:23px;padding:35px 38px 29px}
#modalTitle{margin:0;padding-right:30px;font-size:clamp(25px,3vw,31px);font-weight:650;letter-spacing:-.6px;line-height:1.2;overflow-wrap:anywhere}
#modalClose{position:absolute;right:23px;top:20px;width:34px;height:34px;padding:6px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:#a7b6cf}
#modalClose .uiIcon{width:22px;height:22px}
#modalClose:hover{background:#9bbde00d;color:#fff}
#modalBody{padding:0 38px 32px;font-size:17px;color:#c6d1e4;line-height:1.6;overflow-wrap:anywhere}
#modalBody p{margin:0}
#modalBody strong{color:#f0f4fc;font-weight:650}
.connectInstruction{display:flex;align-items:center;gap:24px;padding:25px 26px;border:1px solid #2c4560;border-radius:16px;background:linear-gradient(115deg,#192b3c66,#16243377);box-shadow:inset 0 1px 0 #d6edff05}
.connectInstruction>.uiIcon{width:36px;height:42px;color:#bdcbe5;stroke-width:1.6}
.instructionText{padding-left:24px;border-left:1px solid #345578;font-size:18px;line-height:1.6;color:#ecf2fc}
.instructionText span{display:block;color:var(--muted);font-size:16px;margin-top:7px}
kbd{display:inline-block;vertical-align:baseline;font:inherit;font-weight:700;letter-spacing:.25px;line-height:1.3;color:#59bfff;background:#10284180;border:1px solid #2c527b;border-radius:7px;padding:3px 7px;white-space:nowrap}
.modalActions{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:24px 38px;border-top:1px solid #2b3d536e;background:#0c152030}
.modalBtn{min-height:48px;min-width:123px;padding:13px 23px;white-space:nowrap}
#modalPrimary{min-width:191px}
.modalBtn.secondary{border-color:#3d5068;background:linear-gradient(130deg,#1b2837,#16212e);color:#e6ecf7;box-shadow:inset 0 1px 0 #ffffff05}
.supportMenu{position:relative;margin-right:auto;color:#94a7c0;font-size:13px;line-height:1.4;flex-shrink:0}
.supportMenu>summary{display:flex;align-items:center;gap:7px;list-style:none;cursor:pointer;padding:9px 0;white-space:nowrap}
.supportMenu>summary::-webkit-details-marker{display:none}
.supportMenu>summary::after{content:"";width:5px;height:5px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px}
.supportMenu[open]>summary::after{transform:rotate(225deg) translate(-1px,-1px)}
.supportMenu>summary:hover{color:#c9dcf1}
.supportPopover{position:absolute;bottom:calc(100% + 12px);left:0;z-index:5;width:min(420px,calc(100vw - 110px));max-height:min(370px,55svh);overflow:auto;border:1px solid #354f6a;border-radius:13px;padding:12px;background:#111e2c;box-shadow:0 16px 50px #000b;scrollbar-width:thin}
.supportAction{display:block;width:100%;padding:11px 12px;text-align:left;font-size:13px;line-height:1.4;color:#bfdafa;border:0;border-radius:7px;background:transparent}
.supportAction:hover:not(:disabled){background:#2b436055}
#modalDetails:empty{display:none}
#modalDetails{padding:9px 12px 4px;border-top:1px solid #293e54;margin-top:6px}
#modalDetails p{font-size:12px;line-height:1.5;color:#aabdd4;margin:0 0 8px;overflow-wrap:anywhere}
#modalLog{display:none;margin:0;max-height:215px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:Consolas,monospace;font-size:11px;line-height:1.55;color:#99afc8;scrollbar-width:thin}
#modalLog.visible{display:block}
.progressPanel{padding:26px;border:1px solid #2c435b;border-radius:16px;background:linear-gradient(115deg,#192b3c66,#16243366)}
.progressTop{display:flex;align-items:center;justify-content:space-between;gap:20px}
#modalMessage{font-size:20px;line-height:1.35;color:#edf3fc;font-weight:550;letter-spacing:-.25px}
#modalPercent{font-size:24px;font-weight:600;letter-spacing:-.5px;color:#5fc3ff;white-space:nowrap;font-variant-numeric:tabular-nums}
.progressShell{height:7px;background:#080f19;border-radius:8px;margin-top:22px;overflow:hidden;box-shadow:inset 0 0 0 1px #293e5488}
#modalProgress{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#167dff,#51bdff);transition:width .16s ease}
#modalBody .progressNote{font-size:14px;color:var(--muted);margin-top:18px;text-align:center}
#hostpsmModal[data-view="progress"] .iconTile{position:relative}
#hostpsmModal[data-view="progress"] .iconTile::after{content:"";position:absolute;inset:-4px;border:1px solid #51b8ff17;border-top-color:#51b8ffb0;border-radius:22px;animation:activeGlow 1.8s ease-in-out infinite}
@keyframes activeGlow{50%{border-top-color:#51b8ff35;border-right-color:#51b8ffb0}}
#hostpsmModal[data-view="success"] .iconTile{color:#8cdbb7;background:#162e2c80;border-color:#35534e}
.resultLead{font-size:18px;color:#bfcde0;line-height:1.65}
.networkDetails{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:24px 0 18px;border:1px solid #30445c;border-radius:14px;background:#30445c;overflow:hidden}
.networkItem{padding:17px 21px;background:#152230}
.networkItem span{display:block;color:#8fa5bf;font-size:12px;line-height:1.4;margin-bottom:5px}
.networkItem strong{font-size:19px;letter-spacing:.2px}
.nextStep{font-size:15px;color:var(--muted)}
.resultNote{padding:18px 21px;border:1px solid #5f503a;border-radius:12px;background:#30271f33;color:#dec7a5;font-size:15px;margin-top:18px!important}
#hostpsmModal[data-view="error"] .iconTile{color:#e0bc91;background:#32282055;border-color:#5c4937}
#hostpsmModal[data-view="cancelled"] .iconTile{color:#b2c0d4}
@media(max-width:620px){
 #root{padding:20px 16px}#panel{border-radius:20px}
 .brandRow{padding:20px;gap:14px;flex-wrap:wrap}.brand{font-size:15px}.compatibility{font-size:11px}
 .homeContent{padding:35px 22px 38px}#stageText{font-size:14px}
 #hostpsmModal{padding:16px}.modalCard{max-height:calc(100svh - 32px);border-radius:19px}
 .modalHead{padding:29px 23px 24px;gap:17px}.iconTile{width:53px;height:53px;border-radius:15px}
 .iconTile .uiIcon{width:30px;height:30px}#modalTitle{font-size:25px;padding-right:13px;letter-spacing:-.4px}
 #modalClose{right:12px;top:12px;width:28px;height:28px}#modalBody{padding:0 23px 25px;font-size:15px}
 .connectInstruction{padding:20px 18px;gap:16px}.connectInstruction>.uiIcon{width:27px;height:35px}
 .instructionText{font-size:16px;padding-left:17px}.instructionText span{font-size:14px;margin-top:9px}
 .modalActions{padding:19px 23px;gap:10px;flex-wrap:wrap}
 .modalBtn{font-size:14px;min-width:96px;padding:12px 18px;min-height:46px}#modalPrimary{min-width:155px}
 .supportMenu{font-size:12px}.supportPopover{width:min(380px,calc(100vw - 80px))}
 .progressPanel{padding:22px 20px}#modalMessage{font-size:18px}#modalPercent{font-size:22px}
 .resultLead{font-size:16px}.networkItem{padding:15px 17px}.networkItem strong{font-size:17px}
}
@media(max-width:420px){
 .brandRow{display:block}.compatibility{display:block;margin-top:10px}
 .modalHead{gap:14px;padding-right:25px}#modalTitle{font-size:22px}
 .connectInstruction>.uiIcon{display:none}.instructionText{border:0;padding:0}
 .modalActions .supportMenu{flex:1 0 100%;margin-top:-5px}
 .modalActions .modalBtn{flex:1}#modalPrimary{min-width:160px}
 .supportMenu>summary{padding:5px 0}.resultLead{font-size:15px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg class="iconDefs" aria-hidden="true"><defs>
<symbol id="chipIcon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol>
<symbol id="usbIcon" viewBox="0 0 24 24"><path d="M8 8V3h8v5M7 8h10v7a5 5 0 0 1-10 0V8Zm5 12v3m-2-18v.5m4-.5v.5"/></symbol>
<symbol id="closeIcon" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="checkIcon" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
<symbol id="alertIcon" viewBox="0 0 24 24"><path d="M12 8v5m0 4h.01"/><circle cx="12" cy="12" r="9"/></symbol>
</defs></svg>
<main id="root">
 <section id="panel" aria-labelledby="stageTitle">
  <header class="brandRow"><div class="brand">HOST PSM <span class="version">v1.1.0</span></div><span class="compatibility">PS5 · FW 12.02–12.70</span></header>
  <div class="homeContent">
   <div class="iconTile" aria-hidden="true"><svg class="uiIcon"><use href="#chipIcon"/></svg></div>
   <h1 id="stageTitle">Instalar na ESP32-S2</h1>
   <p id="stageText">Conecte a placa ao computador para começar.</p>
   <button id="installButton" class="installBtn" type="button">Instalar</button>
   <p id="unsupportedText" class="unsupported" hidden>Abra esta página no Chrome ou Edge.</p>
  </div>
 </section>
</main>
<div id="hostpsmModal" aria-hidden="true">
 <section class="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modalHead">
   <div class="iconTile" aria-hidden="true"><svg class="uiIcon"><use id="modalStateIcon" href="#chipIcon"/></svg></div>
   <h2 id="modalTitle">Conectar ESP32-S2</h2>
   <button id="modalClose" type="button" aria-label="Fechar"><svg class="uiIcon" aria-hidden="true"><use href="#closeIcon"/></svg></button>
  </div>
  <div id="modalBody"></div>
  <div class="modalActions">
   <details id="modalSupport" class="supportMenu">
    <summary id="modalSupportLabel">Ajuda</summary>
    <div class="supportPopover">
     <button id="modalDiagnostic" class="supportAction" type="button" hidden>Testar conexão</button>
     <button id="previousLog" class="supportAction" type="button" hidden>Registro anterior</button>
     <div id="modalDetails"></div>
    </div>
   </details>
   <button id="modalSecondary" class="modalBtn secondary" type="button">Cancelar</button>
   <button id="modalPrimary" class="modalBtn" type="button">Selecionar porta</button>
  </div>
 </section>
</div>
</body>
</html>
